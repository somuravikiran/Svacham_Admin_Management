# =====================================
# SERVER
# =====================================
server.port=${PORT:8081}

spring.application.name=AUTH-SERVICE

# =====================================
# MONGODB
# =====================================
spring.data.mongodb.uri=mongodb+srv://admin:admin123@svacham.78asolj.mongodb.net/svacham_auth_db?retryWrites=true&w=majority&tls=true
spring.data.mongodb.auto-index-creation=true

# ⚠️ REMOVE THIS (NOT VALID PROPERTY)
# spring.data.mongodb.ssl.enabled=true ❌ (REMOVE)

# TLS fix for Render / cloud
JAVA_TOOL_OPTIONS=-Djdk.tls.client.protocols=TLSv1.2,TLSv1.3

# Disable SQL auto config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# =====================================
# EUREKA
# =====================================
eureka.client.service-url.defaultZone=https://svacham-admin-management.onrender.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Optional but useful on Render
eureka.instance.prefer-ip-address=true

# =====================================
# CONFIG SERVER
# =====================================
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# =====================================
# JWT
# =====================================
jwt.secret=svachamsecretkeysvachamsecretkeysvacham123456
jwt.expiration=86400000

# =====================================
# LOGGING (IMPORTANT FOR DEBUGGING)
# =====================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.svacham=DEBUG

# =====================================
# ERROR RESPONSE (REMOVE IN PRODUCTION LATER)
# =====================================
server.error.include-message=always
