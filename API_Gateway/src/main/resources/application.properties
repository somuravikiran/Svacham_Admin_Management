# =========================================
# SERVER CONFIG
# =========================================
server.port=9090

# =========================================
# APPLICATION NAME
# =========================================
spring.application.name=API-GATEWAY

#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173
#
#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
#
#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
#
#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
# =========================================
# EUREKA CONFIG
# =========================================
eureka.client.service-url.defaultZone=https://svacham-admin-management.onrender.com/eureka

# =========================================
# GATEWAY ROUTES
# =========================================

# AUTH SERVICE
spring.cloud.gateway.routes[0].id=AUTH-SERVICE
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# CLIENT SERVICE
spring.cloud.gateway.routes[1].id=CLIENT-SERVICE
spring.cloud.gateway.routes[1].uri=lb://CLIENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/clients/**

# ORDER SERVICE
spring.cloud.gateway.routes[2].id=ORDER-SERVICE
spring.cloud.gateway.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

# SPENDING SERVICE
spring.cloud.gateway.routes[3].id=SPENDING-SERVICE
spring.cloud.gateway.routes[3].uri=lb://SPENDING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/spending/**

# SALARY SERVICE
spring.cloud.gateway.routes[4].id=SALARY-SERVICE
spring.cloud.gateway.routes[4].uri=lb://SALARY-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/salary/**

# GST SERVICE
spring.cloud.gateway.routes[5].id=GSTBILL-SERVICE
spring.cloud.gateway.routes[5].uri=lb://GSTBILL-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/gst-bills/**

# STOCK SERVICE
spring.cloud.gateway.routes[6].id=STOCK-SERVICE
spring.cloud.gateway.routes[6].uri=lb://STOCK-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/stock/**

# DASHBOARD SERVICE
spring.cloud.gateway.routes[7].id=DASHBOARD-SERVICE
spring.cloud.gateway.routes[7].uri=lb://DASHBOARD-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/dashboard/**

# =========================================
# GATEWAY DEBUG LOGS
# =========================================
logging.level.org.springframework.cloud.gateway=DEBUG

